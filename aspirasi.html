<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSIS NEXUS — Aspirasi Masuk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        :root {
            --bg-dark: #05060f;
            --bg-darker: #02030a;
            --blue: #00d4ff;
            --blue-glow: #00a2ff;
            --purple: #a855f7;
            --purple-glow: #7c3aed;
            --pink: #ec4899;
            --text: #e0e7ff;
            --text-dim: #8892b0;
            --glass: rgba(15, 20, 50, 0.5);
            --glass-border: rgba(100, 150, 255, 0.15);
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 2rem 1.5rem;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 10%, rgba(0, 162, 255, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.15), transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.8rem 1.4rem;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--blue);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .back-btn:hover {
            border-color: var(--blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            transform: translateX(-3px);
        }

        .header-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--blue-glow), var(--purple-glow));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            box-shadow: 0 0 40px rgba(0, 162, 255, 0.5);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(90deg, var(--blue), var(--purple), var(--pink));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            margin-bottom: 0.5rem;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .header p {
            color: var(--text-dim);
            letter-spacing: 4px;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        /* STATS BAR */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 162, 255, 0.2);
        }

        .stat-card .stat-num {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }

        .stat-card .stat-label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        /* FILTER */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 2rem;
            align-items: center;
        }

        .filter-bar .label {
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-right: 0.5rem;
        }

        .filter-btn {
            padding: 0.6rem 1.2rem;
            background: rgba(10, 15, 40, 0.5);
            border: 1px solid rgba(100, 150, 255, 0.2);
            border-radius: 20px;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .filter-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, rgba(0, 162, 255, 0.2), rgba(124, 58, 237, 0.2));
            border-color: var(--blue);
            color: var(--blue);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        /* ASPIRASI LIST */
        .aspirasi-list {
            display: grid;
            gap: 1.2rem;
        }

        .aspirasi-item {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 1.5rem 1.8rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .aspirasi-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--blue), var(--purple));
            opacity: 0.8;
        }

        .aspirasi-item:hover {
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 25px rgba(0, 162, 255, 0.1);
            transform: translateX(5px);
        }

        .aspirasi-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(0, 162, 255, 0.2), rgba(124, 58, 237, 0.2));
            border: 1px solid rgba(0, 212, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--blue);
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .user-name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: #fff;
        }

        .user-class {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .kategori-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .kategori-Saran {
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid rgba(0, 212, 255, 0.4);
            color: var(--blue);
        }

        .kategori-Kritik {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
        }

        .kategori-Ide {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #d8b4fe;
        }

        .kategori-Fasilitas {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
        }

        .kategori-Lainnya {
            background: rgba(136, 146, 176, 0.15);
            border: 1px solid rgba(136, 146, 176, 0.3);
            color: var(--text-dim);
        }

        .aspirasi-pesan {
            color: #c7d2fe;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0.8rem 0;
            padding-left: 0.5rem;
        }

        .aspirasi-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(100, 150, 255, 0.1);
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .aspirasi-footer i {
            margin-right: 4px;
            color: var(--blue);
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px dashed var(--glass-border);
            border-radius: 20px;
        }

        .empty-state i {
            font-size: 4rem;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            display: block;
        }

        .empty-state h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 0.8rem;
        }

        .empty-state p {
            color: var(--text-dim);
            margin-bottom: 1.5rem;
        }

        .empty-state a {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.9rem 2rem;
            background: linear-gradient(135deg, var(--blue-glow), var(--purple-glow));
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 162, 255, 0.3);
        }

        .empty-state a:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 162, 255, 0.5);
        }

        /* ACTION BUTTONS */
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .btn-clear {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1.3rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            color: #fca5a5;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .btn-clear:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        /* FOOTER */
        .footer {
            text-align: center;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(100, 150, 255, 0.1);
            color: var(--text-dim);
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .footer .neon {
            color: var(--blue);
            text-shadow: 0 0 10px var(--blue-glow);
        }

        /* RESPONSIVE */
        @media (max-width: 640px) {
            body { padding: 1rem; padding-top: 5rem; }
            .back-btn { top: 1rem; left: 1rem; padding: 0.6rem 1rem; font-size: 0.75rem; }
            .aspirasi-item { padding: 1.2rem; }
            .aspirasi-header { flex-direction: column; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-darker); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--blue-glow), var(--purple-glow));
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Kembali
    </a>

    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <div class="header-icon">
                <i class="fas fa-inbox"></i>
            </div>
            <h1>ASPIRASI MASUK</h1>
            <p>Data Transmisi dari Siswa</p>
        </header>

        <!-- STATS -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-num" id="totalStat">0</div>
                <div class="stat-label">Total Aspirasi</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="saranStat">0</div>
                <div class="stat-label">Saran</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="kritikStat">0</div>
                <div class="stat-label">Kritik</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="ideStat">0</div>
                <div class="stat-label">Ide Kegiatan</div>
            </div>
        </div>

        <!-- ACTION BAR -->
        <div class="action-bar">
            <div class="filter-bar" id="filterBar">
                <span class="label">Filter:</span>
                <button class="filter-btn active" data-filter="all">Semua</button>
                <button class="filter-btn" data-filter="Saran">💡 Saran</button>
                <button class="filter-btn" data-filter="Kritik">⚠️ Kritik</button>
                <button class="filter-btn" data-filter="Ide Kegiatan">🚀 Ide</button>
                <button class="filter-btn" data-filter="Fasilitas">🏫 Fasilitas</button>
            </div>
            <button class="btn-clear" id="clearBtn">
                <i class="fas fa-trash-alt"></i> Hapus Semua
            </button>
        </div>

        <!-- ASPIRASI LIST -->
        <div class="aspirasi-list" id="aspirasiList"></div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2025 <span class="neon">OSIS NEXUS</span> — Data Monitoring System</p>
    </footer>

    <script>
        const STORAGE_KEY = 'osis_nexus_aspirasi';
        let currentFilter = 'all';

        function getAspirasi() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function formatTanggal(iso) {
            const d = new Date(iso);
            const options = { 
                day: 'numeric', 
                month: 'short', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return d.toLocaleDateString('id-ID', options);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderAspirasi() {
            const list = document.getElementById('aspirasiList');
            const data = getAspirasi();

            document.getElementById('totalStat').textContent = data.length;
            document.getElementById('saranStat').textContent = data.filter(a => a.kategori === 'Saran').length;
            document.getElementById('kritikStat').textContent = data.filter(a => a.kategori === 'Kritik').length;
            document.getElementById('ideStat').textContent = data.filter(a => a.kategori === 'Ide Kegiatan').length;

            const filtered = currentFilter === 'all' 
                ? data 
                : data.filter(a => a.kategori === currentFilter);

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-satellite"></i>
                        <h3>${data.length === 0 ? 'Belum Ada Aspirasi' : 'Tidak Ada di Kategori Ini'}</h3>
                        <p>${data.length === 0 ? 'Jadilah yang pertama mengirim transmisi aspirasi!' : 'Coba pilih kategori lain.'}</p>
                        ${data.length === 0 ? '<a href="index.html"><i class="fas fa-paper-plane"></i> Kirim Aspirasi</a>' : ''}
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(item => {
                const kategoriClass = item.kategori === 'Ide Kegiatan' 
                    ? 'kategori-Ide' 
                    : 'kategori-' + item.kategori.replace(/\s+/g, '');

                const kategoriIcon = {
                    'Saran': 'fa-lightbulb',
                    'Kritik': 'fa-exclamation-triangle',
                    'Ide Kegiatan': 'fa-rocket',
                    'Fasilitas': 'fa-school',
                    'Lainnya': 'fa-comment'
                }[item.kategori] || 'fa-tag';

                return `
                    <div class="aspirasi-item">
                        <div class="aspirasi-header">
                            <div class="user-info">
                                <div class="user-avatar">
                                    <i class="fas fa-user-astronaut"></i>
                                </div>
                                <div>
                                    <div class="user-name">${escapeHtml(item.nama)}</div>
                                    <div class="user-class">${escapeHtml(item.kelas)}</div>
                                </div>
                            </div>
                            <span class="kategori-badge ${kategoriClass}">
                                <i class="fas ${kategoriIcon}"></i> ${escapeHtml(item.kategori)}
                            </span>
                        </div>
                        <div class="aspirasi-pesan">"${escapeHtml(item.pesan)}"</div>
                        <div class="aspirasi-footer">
                            <span><i class="fas fa-clock"></i> ${formatTanggal(item.tanggal)}</span>
                            <span><i class="fas fa-fingerprint"></i> ID: ${item.id.toString().slice(-6)}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        document.getElementById('filterBar').addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;

            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderAspirasi();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (confirm('Yakin ingin menghapus SEMUA aspirasi? Tindakan ini tidak dapat dibatalkan.')) {
                localStorage.removeItem(STORAGE_KEY);
                renderAspirasi();
            }
        });

        setInterval(renderAspirasi, 3000);
        renderAspirasi();
    </script>
</body>
</html>
